        <style>
          /* --- Modern Variables & Reset --- */
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-light: #f8fafc;
    --text-dark: #1e293b;
    --text-muted: #64748b;
    --white: #ffffff;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}

* { box-sizing: border-box; transition: all 0.2s ease; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-light);
    color: var(--text-dark);
    margin: 0;
    line-height: 1.6;
}

/* --- Navigation --- */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 5%;
    background: var(--white);
    border-bottom: 1px solid var(--border);
}

.logo { font-size: 1.5rem; font-weight: 800; color: var(--text-dark); }
.logo span { color: var(--primary); }

.nav-links a {
    text-decoration: none;
    color: var(--text-muted);
    margin-right: 2rem;
    font-weight: 500;
}

.nav-links a:hover { color: var(--primary); }

/* --- Layout Container --- */
.container {
    max-width: 900px;
    margin: 3rem auto;
    padding: 2.5rem;
    background: var(--white);
    border-radius: 12px;
    box-shadow: var(--shadow);
}

header h1 {
    font-size: 2rem;
    margin-bottom: 2rem;
    border-left: 5px solid var(--primary);
    padding-left: 15px;
}

/* --- Form Layout & Alignment --- */
.form-section {
    margin-bottom: 2.5rem;
    padding-bottom: 1rem;
}

.form-section h3 {
    font-size: 1.1rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 1.5rem;
}

/* Responsive Grid for Inputs */
.grid-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    margin-bottom: 1.5rem;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.input-group label {
    font-weight: 600;
    font-size: 0.9rem;
}

input, select, textarea {
    padding: 0.8rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

/* --- Tech Stack Chips --- */
.checkbox-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f1f5f9;
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    font-size: 0.85rem;
    border: 1px solid transparent;
}

.chip:hover { background: #e2e8f0; }

.chip input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
}

/* --- Experience & Buttons --- */
textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
}

.generate-btn {
    width: 100%;
    padding: 1rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 1rem;
}

.generate-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}
